# Render Blueprint for FA Apparels
# Dashboard → New → Blueprint → select this repo (branch: main)
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: faapparels-db
    plan: free

services:
  - type: web
    name: faapparels-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build:api
    startCommand: npm run start:api:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: faapparels-db
          property: connectionString

  - type: web
    name: faapparels-web
    runtime: static
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build:web
    staticPublishPath: apps/web/out
    routes:
      # Next export uses trailingSlash folders; keep deep links working
      - type: rewrite
        source: /login
        destination: /login/
      - type: rewrite
        source: /inventory
        destination: /inventory/
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        # Must match your live API hostname after deploy
        value: https://faapparels-api.onrender.com/api/v1
