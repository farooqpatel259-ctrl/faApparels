<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>FA Apparels</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4efe6;
        --ink: #1a1a1a;
        --muted: #6b655c;
        --card: #fffdf8;
        --accent: #1f3a5f;
        --line: rgba(26, 26, 26, 0.12);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(circle at top left, #fff8ea, transparent 45%),
          linear-gradient(160deg, #f7f1e6, #ebe3d4);
        color: var(--ink);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(420px, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 28px 24px;
        box-shadow: 0 18px 40px rgba(40, 28, 10, 0.08);
      }
      .brand {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0.04em;
        margin: 0 0 6px;
      }
      .sub {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 8px;
      }
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 14px;
        font-size: 15px;
        margin-bottom: 16px;
        background: #fff;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 14px 16px;
        background: var(--accent);
        color: white;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      .hint {
        margin-top: 16px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
      }
      .err {
        color: #9b1c1c;
        font-size: 13px;
        margin: 0 0 12px;
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 class="brand">FA APPARELS</h1>
      <p class="sub">
        Connect this phone to the same Wi‑Fi as your computer, then open the
        inventory app.
      </p>
      <p class="err" id="err"></p>
      <label for="serverUrl">Computer address</label>
      <input
        id="serverUrl"
        type="url"
        placeholder="http://10.20.145.228:3000"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="openBtn" type="button">Open inventory app</button>
      <p class="hint">
        Keep <strong>npm run dev:web</strong> and
        <strong>npm run dev:api</strong> running on the computer. Example:
        <code>http://YOUR-PC-IP:3000</code>
      </p>
    </main>
    <script>
      const DEFAULT_URL = "http://10.20.145.228:3000";
      const KEY = "fa.serverUrl";
      const input = document.getElementById("serverUrl");
      const err = document.getElementById("err");
      const saved = localStorage.getItem(KEY);
      input.value = saved || DEFAULT_URL;

      function showError(msg) {
        err.style.display = "block";
        err.textContent = msg;
      }

      document.getElementById("openBtn").addEventListener("click", () => {
        err.style.display = "none";
        let url = (input.value || "").trim().replace(/\/$/, "");
        if (!/^https?:\/\//i.test(url)) {
          url = "http://" + url;
        }
        try {
          const parsed = new URL(url);
          if (!parsed.port) parsed.port = "3000";
          url = parsed.toString().replace(/\/$/, "");
        } catch {
          showError("Enter a valid address like http://10.20.145.228:3000");
          return;
        }
        localStorage.setItem(KEY, url);
        window.location.href = url;
      });

      // Auto-open if we already have a saved working URL and ?setup is not set
      if (saved && !location.search.includes("setup")) {
        setTimeout(() => {
          window.location.href = saved;
        }, 250);
      }
    </script>
  </body>
</html>
