services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory-ops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory_ops
    ports:
      - "5432:5432"
    volumes:
      - inventory_ops_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: inventory-ops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  inventory_ops_pg:
